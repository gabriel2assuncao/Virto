<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Soluções, ferramentas e ideias para facilitar o seu dia a dia de um jeito simples.">
  <title>Virto — Sobre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Manrope:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sobrestyle.css">
</head>
<body>

  <header class="topo">
    <a href="index.html"><img class="logo" src="imagens/slogan1virto.png" alt="Virto"></a>

    <nav>
      <a href="index.html">Início</a>
      <a class="ativo" href="sobre.html">sobre</a>
    </nav>

    <label class="tema" title="Tema claro/escuro">
      <input type="checkbox" aria-label="Ativar tema escuro">
      <span class="icone"><img src="imagens/lua.png" alt=""></span>
    </label>
  </header>




<script>
  (function () {
    var cb = document.querySelector('.tema input');
    function aplicar() {
      try { cb.checked = localStorage.getItem('tema') === 'escuro'; } catch (e) {}
    }
    aplicar();
    window.addEventListener('pageshow', aplicar);
    cb.addEventListener('change', function () {
      try { localStorage.setItem('tema', cb.checked ? 'escuro' : 'claro'); } catch (e) {}
    });
  })();

</script>
</body>
</html>
