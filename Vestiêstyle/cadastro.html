<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vestiê Stile | Cadastro</title><link rel="stylesheet" href="style.css"></head><body class="pagina-login"><main class="login-container"><a href="index.html" class="voltar">← Voltar</a><section class="login-conteudo"><div class="logo-login"><img src="imagens/logo.jpeg" alt="Vestiê Stile"></div><div class="boas-vindas"><h1>Comece seu estilo</h1><p>Crie seu perfil local para testar o protótipo.</p></div><form id="form-cadastro" class="form-login"><div class="campo"><label for="nome">Nome</label><input id="nome" maxlength="30" required autocomplete="name"></div><div class="campo"><label for="email">E-mail</label><input type="email" id="email" required autocomplete="email"></div><div class="campo"><label for="senha">Senha (mínimo 6 caracteres)</label><input type="password" id="senha" minlength="6" required autocomplete="new-password"></div><div class="botoes-login"><button type="submit" class="btn btn-primary">Continuar</button><a class="btn btn-secondary" href="login.html">Já tenho perfil</a></div><p class="aviso">Demonstração local. Senhas não são armazenadas nem verificadas; para contas reais é preciso backend de autenticação.</p><p class="mensagem-fluxo" id="mensagem-login" role="status"></p></form></section></main><script src="shared.js" defer></script><script src="auth.js" defer></script></body></html>
