
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vestiê Stile | Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

  <main class="login-container">

    <!-- Elementos decorativos -->
    <div class="decoracao-topo"></div>
    <div class="circulo circulo-superior"></div>
    <div class="circulo circulo-inferior"></div>

    <!-- Voltar para a tela inicial -->
    <a href="index.html" class="voltar">
      Voltar
    </a>

    <section class="login-conteudo">

      <!-- Logo -->
      <div class="logo-login">
        <img
          src="imagens/logo.jpeg"
          alt="Logo Vestiê Stile"
        >
      </div>

      <!-- Boas-vindas -->
      <div class="boas-vindas">
        <h1>Bem-vinda de volta!</h1>

        <p>
          Seu estilo começa aqui. Entre na sua conta
          e descubra novas combinações.
        </p>
      </div>

      <!-- Acesso demonstrativo local, sem simular autenticação segura -->
      <form class="form-login" id="form-login">
        <div class="campo"><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" required placeholder="Digite seu e-mail"></div>
        <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" minlength="6" required placeholder="Digite sua senha"></div>
        <div class="botoes-login"><a href="home.html" class="btn btn-primary">Entrar</a><a href="cadastro.html" class="btn btn-secondary">Cadastre-se</a></div>
        <p class="aviso">Acesso local de demonstração: não é uma conta autenticada no servidor.</p>
        <p class="mensagem-fluxo" id="mensagem-login" role="status"></p>
      </form>

    </section>

  </main>

<script src="shared.js" defer></script><script src="auth.js" defer></script></body>
</html>
